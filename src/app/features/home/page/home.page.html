<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-icon name="list"></ion-icon>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">home</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="userDisplayContainer">
    <ion-icon name="person" class="userIcon"></ion-icon>
    <h1>Inserir Texto</h1>
    <ion-icon name="create"></ion-icon>
  </div>

  <h1 class="welcomeMessage">Olá, <strong id="userName">Inserir Texto</strong>!</h1>

  <div class="dailyMissionCardPosition">
    <div class="dailyMissionCard">
      <p class="missionDisplay">Missão</p>
      <p class="desafioDiarioDisplay">Desafio diário</p>
      <div class="missionDetails">
        <ion-icon name="flag" class="missionFlagIcon"></ion-icon>
        <p class="missionDescription">Conclua pelo menos uma tarefa para hoje!</p>
      </div>
      <img src="src\assets\main-logo-organiza-sem-nome.png" alt="Logo organiza" class="dailyMissionCardImage">
    </div>
  </div>

  <h1 class="navigationDisplay">Navegação</h1>

  <div class="buttonsContainer">
    <ion-grid>
      <ion-row>
        <ion-col size="6">
          <ion-button expand="block" fill="outline" (click)="navigateToTasks()" class="darkButton">

            <div class="buttonContent">
              <ion-icon name="list" class="buttonIcon"></ion-icon>
              <p class="buttonTitle">Tarefas</p>
              <p class="buttonDescription">Liste seus afazeres e compromissos</p>
            </div>

          </ion-button>
        </ion-col>

        <ion-col size="6">
          <ion-button expand="block" fill="outline" (click)="navigateToHabits()" class="lightButton">

            <div class="buttonContent">
              <ion-icon name="repeat" class="buttonIcon"></ion-icon>
              <p class="buttonTitle">Hábitos</p>
              <p class="buttonDescription">Mantenha ações recorrentes</p>
            </div>

          </ion-button>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col size="6">
          <ion-button expand="block" fill="outline" (click)="navigateToCubes()" class="lightButton">

            <div class="buttonContent">
              <ion-icon name="cube" class="buttonIcon"></ion-icon>
              <p class="buttonTitle">Cubos</p>
              <p class="buttonDescription">Confira sua coleção de cubos especiais</p>
            </div>

          </ion-button>
        </ion-col>

        <ion-col size="6">
          <ion-button expand="block" fill="outline" (click)="navigateToMissions()" class="darkButton">

            <div class="buttonContent">
              <ion-icon name="star" class="buttonIcon"></ion-icon>
              <p class="buttonTitle">Missões</p>
              <p class="buttonDescription">Complete objetivos e ganhe arestas</p>
            </div>

          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

</ion-content>
