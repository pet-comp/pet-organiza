<ion-content class="custom-background">
  <div class="page-container">
    <header class="header-section">
      <div class="back-link" (click)="navigateToTaskList()">
        <ion-icon name="chevron-back-outline" class="back-icon"></ion-icon>
        <span>Voltar ao Menu de Tarefas</span>
      </div>
    </header>

    <div class="separator-bar"></div>

    <main class="main-content">
      <div class="form-section">
        <h1 class="page-title">Nova Categoria</h1>
        <p class="section-subtitle">Informações gerais</p>

        <div class="form-item-wrapper">
          <div class="form-item">
            <span class="title-label">Título:</span>
            <input type="text" class="custom-input"
              placeholder="Insira aqui o título da categoria"
              [value]="category.name"
              (input)="onNameChange($any($event.target).value)"
              (blur)="onNameBlur()">
          </div>
          <span class="campo-erro">{{ erros['name'] }}</span>
        </div>

        <div class="form-item-wrapper">
          <div class="form-item">
            <ion-icon name="reorder-two-outline" class="input-icon"></ion-icon>
            <textarea class="custom-input custom-textarea"
              placeholder="Descreva a categoria (opcional)"
              [value]="category.descricao"
              (input)="onDescricaoChange($any($event.target).value); autoResize($event)"
              rows="1">
            </textarea>
          </div>
          <span class="campo-erro">{{ erros['descricao'] }}</span>
        </div>

        <div class="form-item color-selection-item">
          <span class="item-label">Cor:</span>
          <div class="color-options">
            <div (click)="selecionarCor(340)" class="color-box bg-pink" [class.selected]="category.colorHue === 340 && !corPersonalizada"></div>
            <div (click)="selecionarCor(230)" class="color-box bg-blue" [class.selected]="category.colorHue === 230 && !corPersonalizada"></div>
            <div (click)="selecionarCor(10)" class="color-box bg-salmon" [class.selected]="category.colorHue === 10 && !corPersonalizada"></div>
            <div (click)="selecionarCor(60)" class="color-box bg-yellow" [class.selected]="category.colorHue === 60 && !corPersonalizada"></div>
            <div (click)="selecionarCor(150)" class="color-box bg-light-green" [class.selected]="category.colorHue === 150 && !corPersonalizada"></div>
            <div (click)="selecionarCor(210)" class="color-box bg-grey" [class.selected]="category.colorHue === 210 && !corPersonalizada"></div>
            <div class="color-box add-color"
              [class.selected]="corPersonalizada"
              [style.background-color]="corPersonalizada ? 'hsl(' + category.colorHue + ', 80%, 85%)' : null"
              (click)="toggleHuePicker()">
              <ion-icon name="add"></ion-icon>
            </div>
          </div>
        </div>

        <div *ngIf="mostrarHuePicker" class="hue-picker-wrapper">
          <input type="range" min="0" max="360" value="0"
            (input)="onHueChange($any($event.target).value)"
            class="hue-slider">
        </div>

        <div class="form-item borderless pb-0 mt-3">
          <ion-icon name="color-palette" class="section-icon"></ion-icon>
          <span class="item-label" style="min-width: auto;">Ícone:</span>
        </div>

        <div class="icon-grid">
          <ion-icon (click)="setIcon('heart')" name="heart" class="grid-icon" [class.selected]="category.icon === 'heart-outline'"></ion-icon>
          <ion-icon (click)="setIcon('bandage')" name="bandage" class="grid-icon" [class.selected]="category.icon === 'bandage-outline'"></ion-icon>
          <ion-icon (click)="setIcon('add-circle')" name="add-circle" class="grid-icon" [class.selected]="category.icon === 'add-circle-outline'"></ion-icon>
          <ion-icon (click)="setIcon('laptop')" name="laptop" class="grid-icon" [class.selected]="category.icon === 'laptop-outline'"></ion-icon>
          <ion-icon (click)="setIcon('image')" name="image" class="grid-icon" [class.selected]="category.icon === 'image-outline'"></ion-icon>

          <ion-icon (click)="setIcon('rocket')" name="rocket" class="grid-icon" [class.selected]="category.icon === 'rocket-outline'"></ion-icon>
          <ion-icon (click)="setIcon('time')" name="time" class="grid-icon" [class.selected]="category.icon === 'time-outline'"></ion-icon>
          <ion-icon (click)="setIcon('car')" name="car" class="grid-icon" [class.selected]="category.icon === 'car-outline'"></ion-icon>
          <ion-icon (click)="setIcon('person')" name="person" class="grid-icon" [class.selected]="category.icon === 'person-outline'"></ion-icon>
          <ion-icon (click)="setIcon('briefcase')" name="briefcase" class="grid-icon" [class.selected]="category.icon === 'briefcase-outline'"></ion-icon>

          <ion-icon (click)="setIcon('basketball')" name="basketball" class="grid-icon" [class.selected]="category.icon === 'basketball-outline'"></ion-icon>
          <ion-icon (click)="setIcon('book')" name="book" class="grid-icon" [class.selected]="category.icon === 'book-outline'"></ion-icon>
          <ion-icon (click)="setIcon('pulse')" name="pulse" class="grid-icon" [class.selected]="category.icon === 'pulse-outline'"></ion-icon>

          <div class="view-more-btn">Ver mais...</div>
        </div>

        <div class="form-item borderless pb-0 mt-4">
          <span class="item-label subtitle-label">Pré-visualização:</span>
        </div>

        <app-organiza-category-card [category]="category" [totalTasks]="0" [completedTasks]="0"></app-organiza-category-card>
      </div>
    </main>

    <app-organiza-button 
      label="✓" 
      type="button"
      (onClick)="handleSalvarCategoria()">
    </app-organiza-button>
  </div>
</ion-content>
