<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button color="dark"></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding custom-background">
  <!-- Cabeçalho, Calendário, etc (Mantenha o código existente) -->
  <div class="header-action-row">
    <h1 class="page-title">Hábitos</h1>
    <app-organiza-button
      label="Novo hábito"
      type="submit"
      (onClick)="handleHabitCreate()">
    </app-organiza-button>
  </div>

  <h2 class="section-title">Calendário</h2>
  <div class="weekly-calendar">
    <div class="day-item" *ngFor="let d of weekDays" [class.active]="d.isToday">
      <span class="day-name">{{ d.name }}</span>
      <div class="day-number">{{ d.day }}</div>
    </div>
  </div>

  <h2 class="section-title">Metas</h2>
  <div class="habits-list">
    <!-- MUDANÇA AQUI: (click)="openModal(habit)" em vez de onToggleHabit -->
    <div class="habit-card" *ngFor="let habit of habits" 
         [style.borderColor]="habit.color" 
         (click)="openModal(habit)">
      
      <div class="card-top">
        <div class="progress-fill" [style.width.%]="habit.isInfinity ? 0 : habit.progressPercentage" [style.backgroundColor]="habit.lightColor"></div>
        <div class="card-top-content">
          <h3 [style.color]="habit.color">{{ habit.title }}</h3>
          <div class="progress-text" [style.color]="habit.color">
            <ion-icon name="infinite-outline" *ngIf="habit.isInfinity"></ion-icon>
            <span *ngIf="!habit.isInfinity">{{ habit.progressPercentage }}%</span>
          </div>
        </div>
      </div>

      <div class="card-bottom" [style.backgroundColor]="habit.color">
        <div class="stat-col"><span class="stat-label">Lembrete</span><span class="stat-value">{{ habit.reminder }}</span></div>
        <div class="stat-col"><span class="stat-label">Dias restantes</span><span class="stat-value icon-align">
            <ion-icon name="infinite-outline" *ngIf="habit.daysLeft === 'infinite'"></ion-icon>
            <ng-container *ngIf="habit.daysLeft !== 'infinite'">{{ habit.daysLeft }} dias</ng-container>
          </span></div>
        <div class="stat-col"><span class="stat-label">Recorde</span><span class="stat-value">{{ habit.record }} dias</span></div>
      </div>
    </div>
  </div>

  <!-- MODAL BOTTOM SHEET -->
  <ion-modal [isOpen]="isModalOpen" 
             (didDismiss)="closeModal()" 
             [initialBreakpoint]="0.35" 
             [breakpoints]="[0, 0.35]">
    <ng-template>
      <ion-content class="ion-padding modal-content">
        <div class="modal-header" *ngIf="selectedHabit">
          <div class="modal-icon" [style.backgroundColor]="selectedHabit.lightColor" [style.color]="selectedHabit.color">
            <ion-icon name="star"></ion-icon>
          </div>
          <h2 [style.color]="selectedHabit.color">{{ selectedHabit.title }}</h2>
          <p>Deseja registrar o check-in de hoje?</p>
        </div>
        
        <div class="modal-actions">
          <ion-button expand="block" shape="round" color="success" (click)="confirmAction()">
            <ion-icon slot="start" name="checkmark-circle"></ion-icon> Confirmar
          </ion-button>
          <ion-button expand="block" shape="round" fill="clear" color="medium" (click)="closeModal()">
            Cancelar
          </ion-button>
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
