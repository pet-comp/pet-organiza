<ion-content [fullscreen]="true" class="ion-padding custom-background">
  <h1 class="page-title">Coleção de Cubos</h1>

  <div class="hero-card">
    <img src="assets/cubes/bright-chupacubo.svg" alt="Chupa-cubo" class="mascot-img">
    <h2>Chupa-cubo</h2>
    <p>Recompensa por obter todos os cubos do aplicativo!</p>
    
    <div class="balance-badge">
      <img src="assets/edges.svg" alt="Arestas" class="edges-icon">
      <span><span class="m-bold">Saldo:</span> {{ arestasSaldo }} arestas</span>
    </div>
  </div>

  <ion-segment [(ngModel)]="selectedCategory" mode="md" class="custom-segment">
    <ion-segment-button value="todos">
      <ion-label>Todos</ion-label>
    </ion-segment-button>
    <ion-segment-button value="comuns">
      <ion-label>Comuns</ion-label>
    </ion-segment-button>
    <ion-segment-button value="raros">
      <ion-label>Raros</ion-label>
    </ion-segment-button>
    <ion-segment-button value="lendarios">
      <ion-label>Lendários</ion-label>
    </ion-segment-button>
  </ion-segment>

  <ion-grid>
    <ion-row>
      <ion-col size="4" *ngFor="let cube of filteredCubes">
        <app-cube-card [cube]="cube"></app-cube-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
