<ion-content [fullscreen]="true" class="ion-padding">

  <div class="header-container ion-text-center">
    <img class="chupa-cubo" src="assets/chupa-cubo.svg" alt="Chupa-cubo dizendo Bem-vinde">
  </div>

  <div class="title-container">
    <h2><span>Criar</span> uma nova conta</h2>
  </div>

  <div class="form-container">
    <app-organiza-input
      icon="assets/icons/document.svg"
      placeholder="Nome completo"
      [value]="nome"
      (valueChange)="nome = $event">
    </app-organiza-input>

    <app-organiza-input
      icon="assets/icons/user.svg"
      placeholder="Nome de usuário"
      [value]="username"
      (valueChange)="username = $event">
    </app-organiza-input>

    <app-organiza-input
      icon="assets/icons/cake.svg"
      placeholder="Data de nascimento"
      [value]="nascimento"
      (valueChange)="nascimento = $event">
    </app-organiza-input>

    <app-organiza-input
      icon="assets/icons/mail.svg"
      type="email"
      placeholder="E-mail"
      [value]="email"
      (valueChange)="email = $event">
    </app-organiza-input>

    <app-organiza-input
      icon="assets/icons/lock.svg"
      type="password"
      placeholder="Senha"
      [value]="senha"
      (valueChange)="senha = $event">
    </app-organiza-input>
  </div>

  <div class="main-button-container">
    <app-organiza-button
    label="Cadastrar"
    type="button"
    (onClick)="handleRegister()">
  </app-organiza-button>
  </div>

  <div class="signin-container ion-text-center">
    <ion-text>
      Já tem uma conta? <a (click)="navigateToLogin()">Fazer login</a>
    </ion-text>
  </div>
</ion-content>
