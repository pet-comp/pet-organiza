<div class="container">

  <div class="title-label">
    <ion-icon [name]="mission.icon" class="title-icon"></ion-icon>
    <h1 class="title">{{mission.title}}</h1>
  </div>

  <span class="description">{{mission.description}}</span>

  <div class="arests-label">
    <img src="assets/edges.svg" alt="Arestas" class="edges-icon">
    <span class="arestas-text">+{{mission.arestas}} arestas</span>
  </div>

  @if (mission.status === 'disponivel') {
  <app-organiza-button label="Aceitar Missão" type="button" (onClick)="onAccept()"></app-organiza-button>
  }
  @else if (mission.status === 'em progresso') {
  <ion-progress-bar class="custom-progress" [value]="(mission.progress || 0) / 100"></ion-progress-bar>
  <app-organiza-button label="Cancelar Missão" type="button" (onClick)="onCancel()"></app-organiza-button>
  }

</div>
