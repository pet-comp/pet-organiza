<div class="container">

  <div class="title-label">
    <ion-icon [name]="mission.icon" class="title-icon"></ion-icon>
    <h1 class="title">{{mission.title}}</h1>
  </div>

  <span class="description">{{mission.description}}</span>

  <div class="arests-label">
    <img src="assets/edges.svg" alt="Arestas" class="edges-icon">
    <span class="arestas-text">+{{mission.arestas}} arestas</span>
  </div>

  <app-organiza-button label="Aceitar Missão" type="button"></app-organiza-button>

</div>
