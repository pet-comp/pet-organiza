<ion-content [fullscreen]="true" class="ion-padding custom-background">
  <h1 class="page-title">Missões</h1>

  <ion-segment [(ngModel)]="selectedCategory" mode="md" class="custom-segment">
    <ion-segment-button value="disponivel">
      <ion-label>Disponíveis</ion-label>
    </ion-segment-button>
    <ion-segment-button value="em progresso">
      <ion-label>Em progresso</ion-label>
    </ion-segment-button>
  </ion-segment>

  <div>
    <ion-list lines="none" style="background: transparent; padding: 0;">
      <app-mission-card *ngFor="let mission of filteredMissions" [mission]="mission" (accept)="acceptMission($event)"
        (cancel)="cancelMission($event)" (complete)="completeMission($event)"></app-mission-card>
    </ion-list>
  </div>

  <p class="empty-message">Não há mais missões<br>disponíveis no momento :)</p>

  <div class="overlay" *ngIf="showCompletedCard && completedMission">
    <app-mission-completed [mission]="completedMission" (close)="closeCompletedCard()"></app-mission-completed>
  </div>

  <div class="overlay" *ngIf="showCancelCard && canceledMission">
    <app-mission-cancel [mission]="canceledMission" (close)="closeCancelCard($event)"></app-mission-cancel>
  </div>

</ion-content>
