<ion-content [fullscreen]="true" class="ion-padding custom-background">
  <h1 class="page-title">Missões</h1>

  <ion-segment [(ngModel)]="selectedCategory" mode="md" class="custom-segment">
    <ion-segment-button value="disponiveis">
      <ion-label>Disponíveis</ion-label>
    </ion-segment-button>
    <ion-segment-button value="em-progresso">
      <ion-label>Em progresso</ion-label>
    </ion-segment-button>
  </ion-segment>

  <div>
    <ion-list>
      <app-mission-card *ngFor="let mission of missions" [mission]="mission"></app-mission-card>
    </ion-list>
  </div>
</ion-content>
